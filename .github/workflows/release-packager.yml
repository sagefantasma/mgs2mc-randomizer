name: Auto Release on New Version

on:
  push:
    branches:
      - master  

jobs:
  check-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - name: List current folders
        run: |
          mkdir -p meta
          find "clickonce_releases/Application Files" -maxdepth 1 -mindepth 1 -type d | sort > meta/current_folders.txt
          cat meta/current_folders.txt

      - name: Download previous folder list (if exists)
        uses: actions/download-artifact@v4
        with:
          name: previous-folders
          path: meta
        continue-on-error: true

      - name: Compare folder lists
        id: compare
        run: |
          touch meta/previous_folders.txt
          echo "Previous folders:"
          cat meta/previous_folders.txt || true

          echo "New folders:"
          comm -13 meta/previous_folders.txt meta/current_folders.txt > meta/new_folders.txt
          cat meta/new_folders.txt

          NEW_FOUND=$(wc -l < meta/new_folders.txt)
          echo "new_count=$NEW_FOUND" >> $GITHUB_OUTPUT

          FIRST_NEW_FOLDER=$(head -n 1 meta/new_folders.txt)
          echo "folder_path=$FIRST_NEW_FOLDER" >> $GITHUB_OUTPUT

          FOLDER_NAME=$(basename "$FIRST_NEW_FOLDER")

          VERSION_UNDERSCORE=$(echo "$FOLDER_NAME" | grep -oE '[0-9]+(_[0-9]+)*$')
          VERSION_DOTTED=$(echo "$VERSION_UNDERSCORE" | sed 's/_/./g')

          echo "Extracted version: $VERSION_DOTTED"
          echo "version_number=$VERSION_DOTTED" >> $GITHUB_OUTPUT

      - name: Fail if new folders detected (optional)
        if: steps.compare.outputs.new_count != '0'
        run: |
          echo "release_needed=true" >> $GITHUB_OUTPUT
          echo "❌ New folders were found:"
          cat meta/new_folders.txt
          exit 1

      - name: Save current folder list as artifact for next run
        uses: actions/upload-artifact@v4
        with:
          name: previous-folders
          path: meta/current_folders.txt

      - name: Prepare version files
        if: steps.detect.outputs.release_needed == 'true'
        run: |
          FOLDER="${{ steps.detect.outputs.folder_path }}"
          echo "Renaming .deploy files in $FOLDER"

          find "$FOLDER" -type f -name "*.deploy" | while read file; do
            mv "$file" "${file%.deploy}"
          done

      - name: Install 7z
        if: steps.detect.outputs.release_needed == 'true'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Compress version folder
        if: steps.detect.outputs.release_needed == 'true'
        run: |
          FOLDER="${{ steps.detect.outputs.folder_path }}"
          ARCHIVE_NAME="MGS2_Randomizer_v${{ steps.detect.outputs.version_number }}.7z"
          7z a "$ARCHIVE_NAME" "$FOLDER"

      - name: Create GitHub Release
        if: steps.detect.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.detect.outputs.version_number }}
          name: MGS2 Randomizer v${{ steps.detect.outputs.version_number }} Release
          body: |
            Automated release for version: `${{ steps.detect.outputs.version_number }}`
          files: MGS2_Randomizer_${{ steps.detect.outputs.version_number }}.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
